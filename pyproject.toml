[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Rcolor"
version = "3.1.0"
description = "High-performance Python library for colorful terminal output with automatic terminal capability detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Behnam", email = "Behii@tutanota.com" }
]
keywords = [
    "terminal",
    "color",
    "ansi",
    "truecolor",
    "rainbow",
    "cli",
    "styling",
    "console"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/ibehii/RandomColorlib"
Documentation = "https://github.com/ibehii/RandomColorlib#readme"
Repository = "https://github.com/ibehii/RandomColorlib.git"
Issues = "https://github.com/ibehii/RandomColorlib/issues"
Changelog = "https://github.com/ibehii/RandomColorlib/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["Rcolor*"]

[tool.setuptools.package-data]
Rcolor = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
